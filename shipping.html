<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Delivery & Shipping - Emendion</title>

    <link rel="icon" type="image/svg+xml" href="https://emendion.com/wp-content/uploads/2026/04/Emendion-Main-Menue-Icon-white.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fb; color: #0f172a; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-xl border-b border-slate-200/70">
        <div class="w-full px-4 sm:px-10 lg:px-16 2xl:px-24">
            <div class="flex justify-between items-center h-16 sm:h-20">
                <!-- Logotyp -->
                <a href="index.html" class="flex items-center group py-2">
                    <img src="https://emendion.com/wp-content/uploads/2026/04/Emendion-Main-Menue-Icon-white.svg" 
                         alt="Emendion" 
                         class="h-6 sm:h-7 w-auto object-contain brightness-0 transition-opacity duration-200 group-hover:opacity-70">
                </a>
                <div class="flex items-center gap-2 text-xs font-mono font-semibold">
1.                     
<span class="text-blue-600 bg-blue-50 px-3 py-1 rounded-full border border-blue-200">Delivery & Pickup
</span>
                    <span class="text-slate-300">───</span>
                    <span class="text-slate-400">2. Payment </span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 py-8 w-full">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- Vänsterkolumn: Adressformulär -->
            <div class="lg:col-span-7 space-y-6">
                
                <div class="bg-white border border-slate-200/80 rounded-3xl p-6 sm:p-8 shadow-sm">
                    <div class="flex justify-between items-start mb-1">
                        <h2 class="text-lg font-bold text-slate-900 tracking-tight">Recipient Address</h2>
                    </div>
                    <p class="text-xs text-slate-500 mb-6">Enter your delivery details below</p>

                    <form id="shipping-form" onsubmit="event.preventDefault(); goToPaymentStep();" class="space-y-4">
                        
                        <!-- Land -->
                        <div>
                            <label class="block text-[11px] font-mono text-slate-500 uppercase tracking-wider mb-1">Country / Destination</label>
                            <input type="text" id="country" required value="Sweden" placeholder="Country" oninput="calculateShipping()" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500">
                        </div>

                        <!-- Förnamn och Efternamn -->
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] font-mono text-slate-500 uppercase tracking-wider mb-1">First name</label>
                                <input type="text" id="firstname" required placeholder="First name" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-mono text-slate-500 uppercase tracking-wider mb-1">Last name</label>
                                <input type="text" id="lastname" required placeholder="Last name" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>

                        <!-- E-postadress -->
                        <div>
                            <label class="block text-[11px] font-mono text-slate-500 uppercase tracking-wider mb-1">Email address</label>
                            <input type="email" id="email" required pattern=".*@.*" title="Please enter a valid email address containing @" placeholder="name@example.com" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500">
                        </div>

                        <!-- Landskod + Telefonnummer -->
                        <div>
                            <div class="grid grid-cols-12 gap-2 sm:gap-3">
                                <!-- Landskod -->
                                <div class="col-span-4 sm:col-span-3">
                                    <label class="block text-[11px] font-mono text-slate-500 uppercase tracking-wider mb-1 truncate">Country code</label>
                                    <input type="text" id="phone-prefix" value="+46" placeholder="+46" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm font-mono text-center focus:ring-2 focus:ring-blue-500 bg-slate-50">
                                </div>
                                <!-- Mobilnummer -->
                                <div class="col-span-8 sm:col-span-9">
                                    <label class="block text-[11px] font-mono text-slate-500 uppercase tracking-wider mb-1">Mobile number</label>
                                    <input type="tel" id="phone-number" placeholder="e.g., 70 123 45 67" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-mono focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>
                        </div>

                        <!-- Gatuadress -->
                        <div>
                            <label class="block text-[11px] font-mono text-slate-500 uppercase tracking-wider mb-1">Street address</label>
                            <input type="text" id="street" required placeholder="Street and number" oninput="calculateShipping()" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500">
                        </div>

                        <!-- Postnummer & Ort -->
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] font-mono text-slate-500 uppercase tracking-wider mb-1">Postal code</label>
                                <input type="text" id="zip" required value="90336" placeholder="e.g., 90336" oninput="calculateShipping()" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 font-mono">
                            </div>
                            <div>
                                <label class="block text-[11px] font-mono text-slate-500 uppercase tracking-wider mb-1">City</label>
                                <input type="text" id="city" required value="Umeå" placeholder="City" oninput="calculateShipping()" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>

                        <!-- Fraktkostnad som visas när adressen är inmatad -->
                        <div id="shipping-cost-box" class="hidden pt-4">
                            <div class="p-4 rounded-2xl bg-blue-50/50 border border-blue-200/80 flex items-center justify-between">
                                <div>
                                    <span class="text-[10px] font-mono uppercase tracking-wider text-blue-600 font-bold block">Calculated Shipping</span>
                                    <p id="bottom-shipping-name" class="text-xs font-bold text-slate-900 mt-0.5">PostNord Delivery</p>
                                    <p id="bottom-shipping-desc" class="text-[11px] text-slate-500 font-mono mt-0.5"></p>
                                </div>
                                <span id="bottom-shipping-price" class="text-sm font-mono font-bold text-blue-600 shrink-0 ml-3">0 kr</span>
                            </div>
                        </div>

                        <!-- Fortsätt-knapp -->
                        <div class="pt-6 border-t border-slate-100 mt-8">
                            <button type="submit" id="proceed-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 px-6 rounded-xl font-mono font-bold tracking-wider uppercase text-sm shadow-md transition-all flex items-center justify-center gap-2">
                                <span>Continue to payment</span>
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        </div>
                    </form>

                </div>

            </div>

            <!-- Högerkolumn - Varukorgssammanfattning -->
            <div class="lg:col-span-5">
                <div class="bg-white border border-slate-200/80 rounded-3xl p-6 sm:p-8 shadow-sm sticky top-24">
                    <h2 class="text-base font-bold text-slate-900 mb-4 pb-4 border-b border-slate-100">Shopping Cart</h2>
                    <div id="order-items-list" class="space-y-3 mb-6"></div>

                    <div class="space-y-2.5 pt-4 border-t border-slate-100 text-xs font-mono">
                        <div class="flex justify-between text-slate-500">
                            <span>Subtotal</span>
                            <span id="summary-subtotal">0 kr</span>
                        </div>
                        <div class="flex justify-between text-slate-500">
                            <span>Shipping</span>
                            <span id="summary-shipping" class="text-blue-600 font-bold">Enter address</span>
                        </div>
                        <div class="flex justify-between text-sm font-bold text-slate-900 pt-3 border-t border-slate-100">
                            <span>Total to pay</span>
                            <span id="summary-total">0 kr</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // omväxlig valuta (Bas --> SEK)
        const currencies = {
            SEK: { symbol: 'kr', rate: 1, position: 'suffix', locale: 'sv-SE' },
            USD: { symbol: '$', rate: 0.095, position: 'prefix', locale: 'en-US' },
            EUR: { symbol: '€', rate: 0.088, position: 'prefix', locale: 'de-DE' }
        };

        let currentCurrency = localStorage.getItem('emendion_currency') || 'SEK';

        function formatPrice(amountInSek) {
            if (typeof amountInSek !== 'number' || isNaN(amountInSek)) {
                return amountInSek;
            }

            const config = currencies[currentCurrency] || currencies.SEK;
            const converted = Math.round(amountInSek * config.rate);
            const formattedNum = converted.toLocaleString(config.locale);
            
            if (config.position === 'prefix') {
                return `${config.symbol}${formattedNum}`;
            }
            return `${formattedNum} ${config.symbol}`;
        }

        let cart = [];
        let cartSubtotal = 0;
        let currentShippingMinor = 0;
        let currentShippingOption = null;

        function init() {
            currentCurrency = localStorage.getItem('emendion_currency') || 'SEK';
            try {
                cart = JSON.parse(localStorage.getItem('emendion_cart')) || [];
            } catch(e) { cart = []; }

            if (cart.length === 0) {
                cart = [{ id: "item-001", name: "Emendion LE-Node Mic", price: 1890, quantity: 1 }];
            }

            renderCart();
            calculateShipping();
        }

        // Synka valutaval och varukorg mellan flikar
        window.addEventListener('storage', () => {
            currentCurrency = localStorage.getItem('emendion_currency') || 'SEK';
            try {
                cart = JSON.parse(localStorage.getItem('emendion_cart')) || [];
            } catch(e) { cart = []; }
            renderCart();
            calculateShipping();
        });

        function renderCart() {
            const list = document.getElementById('order-items-list');
            list.innerHTML = '';
            cartSubtotal = 0;

            cart.forEach(item => {
                const lineTotalSek = item.price * item.quantity;
                cartSubtotal += lineTotalSek;

                const div = document.createElement('div');
                div.className = 'flex justify-between items-center text-xs';
                div.innerHTML = `
                    <span class="text-slate-800">${item.name} × ${item.quantity}</span>
                    <span class="font-mono font-semibold">${formatPrice(lineTotalSek)}</span>
                `;
                list.appendChild(div);
            });

            updateTotals();
        }

        function calculateShipping() {
            const countryRaw = document.getElementById('country').value.trim();
            const street = document.getElementById('street').value.trim();
            const zip = document.getElementById('zip').value.trim();
            const city = document.getElementById('city').value.trim();
            const box = document.getElementById('shipping-cost-box');

            // Visa och lägg på frakten först när adressfälten är ifyllda
            if (!countryRaw || !street || !zip || !city) {
                currentShippingMinor = 0;
                currentShippingOption = null;
                box.classList.add('hidden');
                updateTotals();
                return;
            }

            const dest_country = countryRaw.toUpperCase();
            const isSweden = ['SE', 'SWEDEN', 'SVERIGE'].includes(dest_country);
            const isNordic = isSweden || ['DK', 'DENMARK', 'DANMARK', 'FI', 'FINLAND', 'NO', 'NORWAY', 'NORGE'].includes(dest_country);
            const isEurope = isNordic || [
                'DE', 'GERMANY', 'TYSKLAND', 'FR', 'FRANCE', 'FRANKRIKE', 'NL', 'NETHERLANDS', 'NEDERLÄNDERNA',
                'GB', 'UK', 'UNITED KINGDOM', 'STORBRITANNIEN', 'ES', 'SPAIN', 'SPANIEN', 'IT', 'ITALY', 'ITALIEN',
                'AT', 'AUSTRIA', 'ÖSTERRIKE', 'BE', 'BELGIUM', 'BELGIEN', 'PL', 'POLAND', 'POLEN', 'CH', 'SWITZERLAND', 'SCHWEIZ',
                'IE', 'IRELAND', 'IRLAND', 'PT', 'PORTUGAL', 'GR', 'GREECE', 'GREKLAND', 'CZ', 'CZECHIA', 'TJECKIEN', 'HU', 'HUNGARY', 'UNGERN'
            ].includes(dest_country);

            if (isSweden) {
                currentShippingMinor = 8400;  // 84 kr (PostNord Service Point Inrikes)
            } else if (isEurope) {
                currentShippingMinor = 17100; // 171 kr (PostNord Rek/Tracked Europa 250g)
            } else {
                currentShippingMinor = 18000; // 180 kr (PostNord Rek/Tracked Utanför Europa 250g)
            }

            const shippingKr = Math.round(currentShippingMinor / 100);
            const shippingName = isSweden ? "PostNord Service Point" : `PostNord Tracked (${countryRaw})`;
            const shippingDesc = `Delivers to ${street}, ${zip} ${city}`;

            currentShippingOption = {
                id: isSweden ? "postnord_se" : "postnord_intl",
                type: "pickup_point",
                name: shippingName,
                description: shippingDesc,
                price: currentShippingMinor
            };

            document.getElementById('bottom-shipping-name').textContent = shippingName;
            document.getElementById('bottom-shipping-desc').textContent = shippingDesc;
            document.getElementById('bottom-shipping-price').textContent = formatPrice(shippingKr);
            box.classList.remove('hidden');

            updateTotals();
        }

        function updateTotals() {
            const shippingKr = currentShippingOption ? Math.round(currentShippingMinor / 100) : 0;
            document.getElementById('summary-subtotal').textContent = formatPrice(cartSubtotal);
            document.getElementById('summary-shipping').textContent = currentShippingOption ? formatPrice(shippingKr) : "Enter address";
            document.getElementById('summary-total').textContent = formatPrice(cartSubtotal + shippingKr);
        }

        function goToPaymentStep() {
            const emailInput = document.getElementById('email');
            const emailValue = emailInput.value.trim();

            if (!emailValue.includes('@')) {
                alert("Please enter a valid email address containing '@'.");
                emailInput.focus();
                return;
            }

            calculateShipping();

            const prefix = document.getElementById('phone-prefix').value.trim();
            const rawPhone = document.getElementById('phone-number').value.trim();
            const fullPhone = rawPhone ? `${prefix} ${rawPhone}` : '';

            const customer = {
                firstName: document.getElementById('firstname').value.trim(),
                lastName: document.getElementById('lastname').value.trim(),
                email: emailValue,
                phone: fullPhone,
                street: document.getElementById('street').value.trim(),
                zip: document.getElementById('zip').value.trim(),
                city: document.getElementById('city').value.trim(),
                country: document.getElementById('country').value.trim()
            };

            if (!customer.firstName || !customer.lastName || !customer.email || !rawPhone || !customer.street || !customer.zip || !customer.city || !customer.country) {
                alert("Please fill in all fields.");
                return;
            }

            // Spara kund & uträknad frakt inför nästa steg
            localStorage.setItem('emendion_customer_address', JSON.stringify(customer));
            localStorage.setItem('emendion_selected_shipping', JSON.stringify(currentShippingOption));

            window.location.href = 'checkout.html';
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
