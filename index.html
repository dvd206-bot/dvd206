<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emendion | Official Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        emendion: {
                            DEFAULT: '#0f172a', // Slate 900
                            light: '#1e293b',   // Slate 800
                            accent: '#38bdf8'   // Light blue for tech vibe
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .cart-slide { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .cart-hidden { transform: translateX(100%); }
        .cart-visible { transform: translateX(0); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Modern hover effect för produktkort */
        .product-card-hover:hover .product-img { transform: scale(1.05); }
    </style>
</head>
<body class="text-slate-800 antialiased relative overflow-x-hidden min-h-screen flex flex-col selection:bg-emendion-accent selection:text-emendion">

    <header class="bg-emendion text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logotyp -->
                <div class="flex-shrink-0 flex items-center cursor-pointer">
                    <svg class="h-8 w-8 text-emendion-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                    <span class="ml-3 text-2xl font-bold tracking-widest uppercase">Emendion</span>
                </div>
                
                <!-- Varukorg -->
                <button onclick="toggleCart()" class="relative p-2 rounded-full hover:bg-emendion-light transition-colors focus:outline-none focus:ring-2 focus:ring-emendion-accent">
                    <svg class="w-6 h-6 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                    </svg>
                    <!-- Badge -->
                    <span id="cart-badge" class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/4 -translate-y-1/4 bg-emendion-accent rounded-full hidden">
                        0
                    </span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 w-full">
        <div class="mb-12 border-l-4 border-emendion-accent pl-4">
            <h1 class="text-3xl font-extrabold text-emendion uppercase tracking-wide">Produkter</h1>
            <p class="mt-2 text-slate-500">Klicka på en produkt för mer information eller lägg direkt i varukorgen.</p>
        </div>

        <!-- Produktgrid (Populeras av JS) -->
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <!-- Produkter laddas här -->
        </div>
    </main>

    <footer class="bg-emendion-light text-slate-400 mt-auto border-t border-emendion">
        <div class="max-w-7xl mx-auto px-4 py-8 flex flex-col md:flex-row justify-between items-center text-sm">
            <div class="flex items-center mb-4 md:mb-0">
                <svg class="h-6 w-6 text-emendion-accent mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                </svg>
                <span class="font-bold tracking-widest uppercase text-slate-200">Emendion</span>
            </div>
            <div>&copy; 2026 Emendion. Alla rättigheter förbehållna.</div>
        </div>
    </footer>

    <!-- Varukorg Overlay & Drawer -->
    <div id="cart-overlay" class="fixed inset-0 bg-emendion bg-opacity-70 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300" onclick="toggleCart()"></div>
    
    <div id="cart-panel" class="fixed inset-y-0 right-0 w-full max-w-md bg-white shadow-2xl z-50 cart-slide cart-hidden flex flex-col pointer-events-auto border-l border-slate-200">
        <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-white">
            <h2 class="text-xl font-bold text-emendion tracking-wide uppercase">Varukorg</h2>
            <button onclick="toggleCart()" class="text-slate-400 hover:text-emendion transition-colors focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 no-scrollbar space-y-4 bg-slate-50">
            <div id="empty-cart-message" class="text-center text-slate-400 mt-20 flex flex-col items-center">
                <svg class="w-20 h-20 mb-6 text-slate-200" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                </svg>
                <p class="text-lg">Din varukorg är tom.</p>
            </div>
        </div>

        <div class="px-6 py-6 border-t border-slate-100 bg-white">
            <div class="flex justify-between text-lg font-bold text-emendion mb-6">
                <p>Totalt belopp</p>
                <p id="cart-total">0 kr</p>
            </div>
            
            <button id="checkout-btn" onclick="handleCheckout()" class="w-full bg-emendion hover:bg-emendion-light text-white px-6 py-4 rounded-none tracking-widest uppercase font-semibold shadow-lg transition-all active:scale-[0.99] flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                <svg class="w-5 h-5 text-emendion-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
                <span>Gå till säker kassa</span>
            </button>
            <p class="text-center text-xs text-slate-400 mt-3 flex items-center justify-center gap-1">
                Krypterad och säker betalning via Stripe
            </p>
        </div>
    </div>

    <script>
        // --- 1. Produktmallar ---
        const products = [
            {
                id: "item-001",
                name: "[Ditt Produktnamn 1]",
                description: "[Här kan du skriva en kort beskrivning av din produkt. Byt ut bilden mot din egen produktbild.]",
                price: 1000,
                image: "https://placehold.co/800x800/1e293b/ffffff?text=L%C3%A4gg+in+bild+h%C3%A4r"
            },
            {
                id: "item-002",
                name: "[Ditt Produktnamn 2]",
                description: "[Här kan du skriva en kort beskrivning av din produkt. Byt ut bilden mot din egen produktbild.]",
                price: 2500,
                image: "https://placehold.co/800x800/1e293b/ffffff?text=L%C3%A4gg+in+bild+h%C3%A4r"
            },
            {
                id: "item-003",
                name: "[Ditt Produktnamn 3]",
                description: "[Här kan du skriva en kort beskrivning av din produkt. Byt ut bilden mot din egen produktbild.]",
                price: 500,
                image: "https://placehold.co/800x800/1e293b/ffffff?text=L%C3%A4gg+in+bild+h%C3%A4r"
            }
        ];

        let cart = [];
        let isCartOpen = false;

        // --- 2. Rendera produkter (länkar i samma flik) ---
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card-hover bg-white flex flex-col border border-slate-200 hover:shadow-2xl transition-all duration-300';
                
                card.innerHTML = `
                    <a href="product.html?id=${product.id}" class="block flex-grow relative overflow-hidden group cursor-pointer">
                        <div class="aspect-square bg-slate-100 overflow-hidden border-b border-slate-100">
                            <img src="${product.image}" alt="${product.name}" class="product-img object-cover w-full h-full transition-transform duration-700 ease-out">
                        </div>
                        <div class="p-6">
                            <h3 class="text-xl font-bold text-emendion mb-2 tracking-wide">${product.name}</h3>
                            <p class="text-slate-500 text-sm line-clamp-2">${product.description}</p>
                        </div>
                    </a>
                    
                    <div class="px-6 pb-6 pt-0 flex items-end justify-between mt-auto bg-white relative z-10">
                        <div>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">Pris</span>
                            <span class="text-2xl font-extrabold text-emendion">${product.price.toLocaleString('sv-SE')} <span class="text-sm font-medium">kr</span></span>
                        </div>
                        <button onclick="addToCart('${product.id}')" class="bg-emendion-light hover:bg-emendion-accent hover:text-emendion text-white p-3 rounded-none transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-emendion" title="Lägg i varukorg">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                            </svg>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- 3. Varukorgshantering ---
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            
            if(!isCartOpen) {
                showToast(`${product.name} tillagd i varukorgen`);
            }
            
            updateCartUI();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        function changeQuantity(productId, delta) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                } else {
                    updateCartUI();
                }
            }
        }

        // --- 4. Uppdatera UI för Varukorg ---
        function updateCartUI() {
            const container = document.getElementById('cart-items-container');
            const emptyMessage = document.getElementById('empty-cart-message');
            const totalElement = document.getElementById('cart-total');
            const badge = document.getElementById('cart-badge');
            const checkoutBtn = document.getElementById('checkout-btn');

            container.querySelectorAll('.cart-item-row').forEach(item => item.remove());

            let total = 0;
            let totalItems = 0;

            if (cart.length === 0) {
                emptyMessage.classList.remove('hidden');
                checkoutBtn.disabled = true;
                badge.classList.add('hidden');
            } else {
                emptyMessage.classList.add('hidden');
                checkoutBtn.disabled = false;
                badge.classList.remove('hidden');

                cart.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    totalItems += item.quantity;

                    const div = document.createElement('div');
                    div.className = 'cart-item-row flex items-center gap-4 bg-white p-4 border border-slate-100 shadow-sm';
                    div.innerHTML = `
                        <img src="${item.image}" alt="${item.name}" class="w-20 h-20 object-cover bg-slate-100 border border-slate-200">
                        <div class="flex-1">
                            <h4 class="text-sm font-bold text-emendion">${item.name}</h4>
                            <p class="text-slate-500 font-medium text-sm mt-1">${item.price.toLocaleString('sv-SE')} kr</p>
                            
                            <div class="flex items-center mt-3 border border-slate-200 w-fit">
                                <button onclick="changeQuantity('${item.id}', -1)" class="px-3 py-1 bg-slate-50 hover:bg-slate-200 text-slate-600 transition-colors">-</button>
                                <span class="px-3 py-1 text-sm font-bold text-emendion min-w-[2rem] text-center">${item.quantity}</span>
                                <button onclick="changeQuantity('${item.id}', 1)" class="px-3 py-1 bg-slate-50 hover:bg-slate-200 text-slate-600 transition-colors">+</button>
                            </div>
                        </div>
                        <button onclick="removeFromCart('${item.id}')" class="p-2 text-slate-300 hover:text-red-500 transition-colors" title="Ta bort">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    `;
                    container.appendChild(div);
                });
            }

            totalElement.textContent = `${total.toLocaleString('sv-SE')} kr`;
            badge.textContent = totalItems;
        }

        // --- 5. Toggles & UI Hantering ---
        function toggleCart() {
            isCartOpen = !isCartOpen;
            const overlay = document.getElementById('cart-overlay');
            const panel = document.getElementById('cart-panel');
            
            if (isCartOpen) {
                overlay.classList.remove('hidden');
                setTimeout(() => {
                    overlay.classList.remove('opacity-0');
                    panel.classList.remove('cart-hidden');
                    panel.classList.add('cart-visible');
                    document.body.style.overflow = 'hidden';
                }, 10);
            } else {
                overlay.classList.add('opacity-0');
                panel.classList.remove('cart-visible');
                panel.classList.add('cart-hidden');
                document.body.style.overflow = '';
                
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 300);
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-emendion text-white px-6 py-3 shadow-2xl z-[70] transition-all duration-300 translate-y-20 opacity-0 border border-slate-700 font-medium tracking-wide flex items-center gap-3';
            toast.innerHTML = `<svg class="w-5 h-5 text-emendion-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> ${message}`;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('translate-y-20', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-20');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- 6. Säker Utcheckning med Stripe Backend ---
        async function handleCheckout() {
            if (cart.length === 0) return;

            const btn = document.getElementById('checkout-btn');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Ansluter till kassan...</span>
            `;

            const cartData = cart.map(item => ({
                id: item.id,
                name: item.name,
                price: item.price,
                quantity: item.quantity || 1
            }));

            try {
                const response = await fetch('/api/create-checkout-session', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        items: cartData
                    }),
                });

                const data = await response.json();

                if (data.url) {
                    // Slussa kunden vidare till Stripes krypterade betalsida
                    window.location.href = data.url;
                } else {
                    alert('Något gick fel vid initiering av betalning: ' + (data.error || 'Försök igen senare.'));
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            } catch (err) {
                console.error('Checkout error:', err);
                alert('Kunde inte ansluta till betaltjänsten. Kontrollera att backend-funktionen är publicerad på Vercel.');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // --- 7. Initiering ---
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            updateCartUI();
        });
    </script>
</body>
</html>
