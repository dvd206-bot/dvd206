<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Betalning - Emendion</title>

    <link rel="icon" type="image/svg+xml" href="https://emendion.com/wp-content/uploads/2026/04/Emendion-Main-Menue-Icon-white.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fb; color: #0f172a; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Header med Steg-indikator -->
    <header class="bg-white/90 backdrop-blur-xl border-b border-slate-200/70 py-4 sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center">
                <img src="https://emendion.com/wp-content/uploads/2026/04/Emendion-Main-Menue-Icon-white.svg" alt="Emendion" class="h-6 w-auto brightness-0">
            </a>
            <!-- Steg -->
            <div class="flex items-center gap-2 text-xs font-mono font-semibold">
                <a href="shipping.html" class="text-emerald-600 hover:underline">✓ 1. Leverans vald</a>
                <span class="text-slate-300">───</span>
                <span class="text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full border border-blue-200">2. Betalning (Klarna)</span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 py-8 w-full">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- Vänsterkolumn: Vald frakt & Klarna Iframe -->
            <div class="lg:col-span-7 space-y-6">
                
                <!-- Sammanfattning av vald leverans -->
                <div class="bg-white border border-slate-200/80 rounded-2xl p-5 shadow-sm flex items-center justify-between">
                    <div>
                        <span class="text-[10px] font-mono uppercase tracking-wider text-slate-400">Valt utlämningsställe / leverans</span>
                        <h3 id="display-shipping-name" class="text-sm font-bold text-slate-900 mt-0.5">PostNord Ombud</h3>
                        <p id="display-shipping-address" class="text-xs text-slate-500 font-mono mt-0.5"></p>
                    </div>
                    <a href="shipping.html" class="text-xs font-mono text-blue-600 hover:underline font-bold shrink-0 ml-4">
                        Ändra ombud
                    </a>
                </div>

                <!-- Klarna Checkout Container -->
                <div class="bg-white border border-slate-200/80 rounded-3xl p-6 sm:p-8 shadow-sm">
                    <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
                        <h2 class="text-base sm:text-lg font-bold text-slate-900 tracking-tight">Klarna Checkout</h2>
                        <span class="text-xs font-mono font-bold text-pink-600 bg-pink-50 px-2.5 py-1 rounded-lg border border-pink-200">Klarna.</span>
                    </div>

                    <div id="klarna-checkout-container" class="min-h-[300px] flex items-center justify-center">
                        <div id="klarna-loading" class="text-center font-mono text-xs text-slate-400">
                            <div class="w-6 h-6 border-2 border-slate-300 border-t-pink-600 rounded-full animate-spin mx-auto mb-2"></div>
                            Laddar säker Klarna-kassa...
                        </div>
                    </div>
                </div>

            </div>

            <!-- Högerkolumn: Totalbelopp -->
            <div class="lg:col-span-5">
                <div class="bg-white border border-slate-200/80 rounded-3xl p-6 sm:p-8 shadow-sm sticky top-24">
                    <h2 class="text-base font-bold text-slate-900 mb-4 pb-4 border-b border-slate-100">Orderöversikt</h2>
                    <div id="checkout-items" class="space-y-3 mb-6"></div>

                    <div class="space-y-2.5 pt-4 border-t border-slate-100 text-xs font-mono">
                        <div class="flex justify-between text-slate-500">
                            <span>Varor</span>
                            <span id="co-subtotal">0 kr</span>
                        </div>
                        <div class="flex justify-between text-slate-500">
                            <span>PostNord Frakt</span>
                            <span id="co-shipping" class="text-blue-600 font-bold">0 kr</span>
                        </div>
                        <div class="flex justify-between text-sm font-bold text-slate-900 pt-3 border-t border-slate-100">
                            <span>Totalsumma att betala</span>
                            <span id="co-total">0 kr</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        let customer = null;
        let selectedShipping = null;
        let cart = [];

        document.addEventListener('DOMContentLoaded', () => {
            customer = JSON.parse(localStorage.getItem('emendion_customer_address'));
            selectedShipping = JSON.parse(localStorage.getItem('emendion_selected_shipping'));
            cart = JSON.parse(localStorage.getItem('emendion_cart')) || [];

            // Om kunden inte valt frakt först --> skicka till steg 1
            if (!customer || !selectedShipping) {
                window.location.href = 'shipping.html';
                return;
            }

            document.getElementById('display-shipping-name').textContent = selectedShipping.name;
            document.getElementById('display-shipping-address').textContent = `${selectedShipping.description} (${customer.street}, ${customer.zip} ${customer.city})`;

            renderOrderSummary();
            initKlarnaOrder();
        });

        function renderOrderSummary() {
            const list = document.getElementById('checkout-items');
            list.innerHTML = '';
            let subtotal = 0;

            cart.forEach(item => {
                subtotal += (item.price * item.quantity);
                const d = document.createElement('div');
                d.className = 'flex justify-between text-xs';
                d.innerHTML = `<span>${item.name} × ${item.quantity}</span><span class="font-mono">${item.price * item.quantity} kr</span>`;
                list.appendChild(d);
            });

            const shippingKr = Math.round(selectedShipping.price / 100);
            document.getElementById('co-subtotal').textContent = subtotal + " kr";
            document.getElementById('co-shipping').textContent = shippingKr + " kr";
            document.getElementById('co-total').textContent = (subtotal + shippingKr) + " kr";
        }

        async function initKlarnaOrder() {
            try {
                const res = await fetch('/api/create-klarna-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        items: cart,
                        shipping_option: selectedShipping,
                        customer: customer,
                        currency: 'SEK'
                    })
                });

                const data = await res.json();
                const container = document.getElementById('klarna-checkout-container');

                if (data.html_snippet) {
                    container.innerHTML = data.html_snippet;
                    // Kör Klarnas inbäddade JavaScript
                    const scripts = container.getElementsByTagName("script");
                    for (let s of scripts) {
                        const newScript = document.createElement("script");
                        newScript.text = s.text;
                        document.body.appendChild(newScript);
                    }
                } else if (data.mock) {
                    // Visas innan du lagt in skarpa Klarna-uppgifter
                    container.innerHTML = `
                        <div class="p-6 bg-slate-50 border border-slate-200 rounded-2xl text-center">
                            <span class="text-xs font-mono text-pink-600 font-bold uppercase tracking-wider block mb-2">Klarna Redo</span>
                            <p class="text-xs text-slate-600 leading-relaxed">${data.message}</p>
                            <button onclick="window.location.href='success.html?order_id=TEST-ORD'" class="mt-4 bg-slate-900 text-white px-5 py-2.5 rounded-xl font-mono text-xs uppercase font-bold">
                                Slutför testköp direkt
                            </button>
                        </div>
                    `;
                }
            } catch (err) {
                console.error("Fel vid start av Klarna -->", err);
            }
        }
    </script>
</body>
</html>
